<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Log in to Mastodon</title>
    <script type="module" src="./login.js"></script>
  </head>
  <body>
    <main>
      <form id="login-form">
        <label>
          Mastodon server
          <input id="server-name" name="serverName" required>
        </label>
        <button type="submit">Log in</button>
        <button type="button" id="cancel-login">Cancel</button>
      </form>
    </main>
  </body>
</html>
